<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denuncia Vigilancia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Sua Denuncia</h1>

        <form action="https://formsubmit.co/deliomarbatistabr@gmail.com" method="POST">

            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_subject" value="Nova denúncia recebida">
            

            <div class="grid">

                <div class="campo">
                    <label for="identificacao">Identificação</label>

                    <select id="identificacao" onchange="mostrarNome()">
                        <option value="anonimo">Anônimo</option>
                        <option value="nome">Nome(a)</option>
                    </select>
                </div>

                <div class="campo" id="campoNome" style="display: none;">
                    <label for="nome">Seu Nome</label>
                    <input type="text" id="nome" name="Nome" placeholder="Digite seu nome">
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="Cidade" placeholder="Cidade">
                </div>

                <div class="campo">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="Bairro" placeholder="Bairro">
                </div>

                <div class="campo">
                    <label for="rua">Rua</label>
                    <input type="text" id="rua" name="Rua" placeholder="Rua">
                </div>

                <div class="campo">
                    <label for="referencia">Ponto de Referência</label>
                    <input type="text" id="referencia" name="Referência" placeholder="Ex: perto da praça">
                </div>

                <div class="campo">
                    <label for="mensagem">Denúncia</label>
                    <textarea id="mensagem" name="Denúncia" placeholder="Escreva sua denúncia"></textarea>
                </div>

            </div>

            <button type="submit">Enviar</button>

        </form>

    </div>

    <script>
        function mostrarNome() {
            let escolha = document.getElementById("identificacao").value;
            let campoNome = document.getElementById("campoNome");

            if (escolha === "nome") {
                campoNome.style.display = "block";
            } else {
                campoNome.style.display = "none";
            }
        }
    </script>

</body>
</html>
